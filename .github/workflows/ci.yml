name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q
        env:
          PYTHONPATH: src:.
      - name: Verify published benchmark evidence
        run: python benchmarks/verify_artifacts.py
      - name: Reproduce the keyless workflow demo
        if: matrix.python == '3.12'
        run: |
          mkdir -p reports
          python -m pytest -q --basetemp=reports/judge-demo tests/server/test_workflow_chat.py
      - name: Run the reproducible harness benchmark
        if: matrix.python == '3.12'
        run: python benchmarks/run_benchmark.py --output reports/benchmark-run --repetitions 3
      - name: Upload benchmark results and synthetic delivery
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: molchat-harness-benchmark-synthetic
          path: reports/benchmark-run/
          if-no-files-found: error
      - name: Upload the synthetic demo delivery
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: molchat-keyless-demo-synthetic
          path: |
            reports/judge-demo/*/salida/**/entrega.zip
            !reports/judge-demo/*current/**
          if-no-files-found: error
      - run: python -m conformance.runner
        env:
          PYTHONPATH: src:.
      - run: python scripts/check_provenance.py
      - run: python scripts/check_secrets.py
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: python scripts/check_ui_build.py
      - run: python -m build
      - run: python scripts/make_manifest.py --write
      - run: python scripts/make_manifest.py --check dist/molchat-vendorizable
      - name: Install the wheel and exercise the installed CLI
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: molchat-agent plan --provider fake "List receptors"
        working-directory: ${{ runner.temp }}
