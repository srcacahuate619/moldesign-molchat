name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Standalone Docker verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone agent and simulator image
        run: docker build --build-arg SOURCE_COMMIT="${{ github.sha }}" -f benchmarks/Dockerfile -t molchat-benchmark .
      - name: Start the sidecar without external networking
        run: |
          mkdir -p reports/docker-verification
          docker run --rm --network none molchat-benchmark python benchmarks/smoke_sidecar.py > reports/docker-verification/sidecar.json
      - name: Run the synthetic benchmark without networking or credentials
        run: |
          docker run --rm --network none \
            --mount type=bind,src="$PWD/reports/docker-verification",dst=/molchat/reports/benchmark-run \
            molchat-benchmark
      - name: Summarize the verified container
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path('reports/docker-verification')
          result = json.loads((output / 'results.json').read_text())
          sidecar = json.loads((output / 'sidecar.json').read_text())
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', 'molchat-benchmark']))[0]
          proof = {'source_commit': os.environ['GITHUB_SHA'], 'image_id': image['Id'],
                   'os': image['Os'], 'architecture': image['Architecture'], 'runtime_network': 'none',
                   'sidecar': sidecar, 'benchmark': result['summary']}
          (output / 'verification.json').write_text(json.dumps(proof, indent=2) + '\n')
          counts = ', '.join(f"{c['passed']}/{sum(c.values())}" for c in result['summary']['checks_per_repetition'])
          summary = f"## Standalone Docker verification\n\nSource: `{proof['source_commit']}`\n\nImage: {proof['os']}/{proof['architecture']}\n\nSidecar health: passed. Synthetic checks per repetition: {counts}. Both runtime checks used `--network none` and no provider credentials.\n\nScope: agent and simulator; no MolDesign desktop, Vina or Blender.\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(summary)
          PY
      - name: Upload Docker verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molchat-docker-verification-synthetic
          path: reports/docker-verification/
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q
        env:
          PYTHONPATH: src:.
      - name: Verify published benchmark evidence
        run: python benchmarks/verify_artifacts.py
      - name: Reproduce the keyless workflow demo
        if: matrix.python == '3.12'
        run: |
          mkdir -p reports
          python -m pytest -q --basetemp=reports/judge-demo tests/server/test_workflow_chat.py
      - name: Run the reproducible harness benchmark
        if: matrix.python == '3.12'
        run: python benchmarks/run_benchmark.py --output reports/benchmark-run --repetitions 3
      - name: Upload benchmark results and synthetic delivery
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: molchat-harness-benchmark-synthetic
          path: reports/benchmark-run/
          if-no-files-found: error
      - name: Upload the synthetic demo delivery
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: molchat-keyless-demo-synthetic
          path: |
            reports/judge-demo/*/salida/**/entrega.zip
            !reports/judge-demo/*current/**
          if-no-files-found: error
      - run: python -m conformance.runner
        env:
          PYTHONPATH: src:.
      - run: python scripts/check_provenance.py
      - run: python scripts/check_secrets.py
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: python scripts/check_ui_build.py
      - run: python -m build
      - run: python scripts/make_manifest.py --write
      - run: python scripts/make_manifest.py --check dist/molchat-vendorizable
      - name: Install the wheel and exercise the installed CLI
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: molchat-agent plan --provider fake "List receptors"
        working-directory: ${{ runner.temp }}
